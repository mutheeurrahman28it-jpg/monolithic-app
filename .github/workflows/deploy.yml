name: Docker CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: docker build -t monolithic-app .

      - name: Tag Docker Image
        run: docker tag monolithic-app:latest 525125475263.dkr.ecr.ap-south-1.amazonaws.com/monolithic-app:latest

      - name: Push Docker Image
        run: docker push 525125475263.dkr.ecr.ap-south-1.amazonaws.com/monolithic-app:latest

      - name: Deploy to ECS Fargate
        run: |
          aws ecs update-service \
            --cluster monolithic-cluster \
            --service monolithic-task-service-at0xk0p6 \
            --force-new-deployment